
name: Auto Unzip for GlassBrowser

on:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z" -d .
            rm "$z"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract ZIP archive"
          git push

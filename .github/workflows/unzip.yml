name: Auto Unzip for GlassBrowser

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'
  workflow_dispatch:
⁴
permissions:
  contents: write

jobs:
  unzip-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout glassbrowser repository
        uses: actions/checkout@v4

      - name: Extract all zip files
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z" -d .
            rm "$z"
          done

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          git commit -m "Extract zip archive into glassbrowser" || exit 0
          git push
